    justification: >
      These literals are reserved pi-ai service ids on SERVER_DIRECT_AI_SERVICE_IDS.
      Plugins are forbidden to register them (assertAiServiceRegistrable); the names
      do not select or call restricted models.
  - id: packages/plugin-sdk/src/internal/host-policy.ts:6f7ac1823da81d2e52d1a1549ee69c85bbf8bb56d06682849e7c09da2785ce3b
    justification: >
      Reserved server-direct AI service id. Listing it here prevents a plugin from
      capturing that id and intercepting prompts; it is not outbound model configuration.
